name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
      - run: flutter pub get
      # Keep legacy lint findings visible without hiding real analyzer errors.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

  worker:
    name: Worker Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check tools/bangumi_auth_worker/worker.js
      - run: node --test tools/bangumi_auth_worker/year_ranking.test.mjs
      - run: node --test tools/bangumi_auth_worker/app_update_manifest.test.mjs

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter test --coverage

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
      - run: flutter pub get
      - run: cd example && flutter build apk --debug
