name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: 'stable'
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test example/lib
      - run: flutter analyze

  worker:
    name: Worker Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check tools/bangumi_auth_worker/worker.js
      - run: node --test tools/bangumi_auth_worker/*.test.mjs

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: 'stable'
      - run: flutter pub get
      - name: Unit tests and unit coverage gate
        run: |
          find test -mindepth 1 -maxdepth 1 ! -name widgets \( -type d -o -name '*_test.dart' \) -print0 | xargs -0 flutter test --coverage --coverage-path coverage/unit/lcov.info
          dart run tool/check_coverage.dart coverage/unit/lcov.info 17.5
      - name: All tests and combined coverage report
        run: flutter test --coverage --coverage-path coverage/all/lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage/

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: 'stable'
      - run: flutter pub get
      - run: cd example && flutter build apk --debug

  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: 'stable'
      - run: flutter pub get
      - run: cd example && flutter build windows --debug

  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: 'stable'
      - run: flutter pub get
      - run: cd example && flutter build ios --debug --no-codesign
